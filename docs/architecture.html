<main class="workspace"><div id="workflow-canvas" class="canvas"><svg xmlns="http://www.w3.org/2000/svg" data-graph="workflow" viewBox="0 0 1410 885" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">Resume matching: connected conversation workflow</title><desc id="workflow-desc">Compiled conversation graph with local initial retrieval, detailed candidate assessment, comparative recommendations and persistent feedback.</desc><defs><marker id="workflow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1410" height="885" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="60" y="43" fill="#64748b" font-size="11" letter-spacing="1">01 / CONVERSATION STATE</text><text x="60" y="82" fill="#0f172a" font-size="28" font-weight="600">LangGraph conversation state machine</text><text x="60" y="108" fill="#475569" font-size="13">Resume matching agent • Three screening stages • SQLite checkpoints</text><text x="90" y="165" fill="#475569" font-size="11">INITIAL SCREENING</text><text x="870" y="352" fill="#475569" font-size="11">REPORT AND HUMAN FEEDBACK</text><text x="90" y="508" fill="#475569" font-size="11">CONDITIONAL ACTIONS FROM REQUEST ROUTER</text><text x="90" y="389" fill="#334155" font-size="12">Input: job description or conversation request</text><text x="90" y="413" fill="#334155" font-size="12">Corpus: 200 PDF / DOCX / TXT profiles</text><text x="90" y="437" fill="#334155" font-size="12">Initial output: 10 provisional candidates; qualification unassessed</text><text x="740" y="679" fill="#475569" font-size="11">Detailed review prerequisite</text><text x="740" y="697" fill="#64748b" font-size="10">finalize → deep_screen → final_screen when a review is missing</text><path class="edge" data-source="__start__" data-target="parse_jd" data-conditional="false" d="M 50 231 H 83" fill="none" stroke="#0369a1" stroke-width="2.2" opacity="1" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="compare_candidates" data-target="generate_report" data-conditional="false" d="M 180.0 555 V 489 H 1230.0 V 459" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="deep_screen" data-target="final_screen" data-conditional="true" d="M 900 596 H 923" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="deep_screen" data-target="generate_report" data-conditional="true" d="M 810.0 555 V 489 H 1230.0 V 459" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="expand_search" data-target="generate_report" data-conditional="true" d="M 960.0 272 V 314 H 1230.0 V 363" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="expand_search" data-target="rank_candidates" data-conditional="true" d="M 1050 231 H 1133" fill="none" stroke="#0369a1" stroke-width="2.2" opacity="1" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="extract_requirements" data-target="generate_report" data-conditional="true" d="M 440.0 272 V 314 H 1230.0 V 363" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="extract_requirements" data-target="search_resumes" data-conditional="true" d="M 530 231 H 603" fill="none" stroke="#0369a1" stroke-width="2.2" opacity="1" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="file_tool" data-target="generate_report" data-conditional="false" d="M 600.0 555 V 489 H 1230.0 V 459" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="final_screen" data-target="generate_report" data-conditional="false" d="M 1020.0 555 V 489 H 1230.0 V 459" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="generate_report" data-target="human_feedback" data-conditional="false" d="M 1140 411 H 1057" fill="none" stroke="#0369a1" stroke-width="2.2" opacity="1" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="human_feedback" data-target="parse_jd" data-conditional="false" d="M 960.0 370 V 130 H 180.0 V 183" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="interview_questions" data-target="generate_report" data-conditional="false" d="M 390.0 555 V 489 H 1230.0 V 459" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="compare_candidates" data-conditional="true" d="M 90 231 H 65 V 524 H 180.0 V 548" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="deep_screen" data-conditional="true" d="M 90 231 H 65 V 524 H 810.0 V 548" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="extract_requirements" data-conditional="true" d="M 270 231 H 343" fill="none" stroke="#0369a1" stroke-width="2.2" opacity="1" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="file_tool" data-conditional="true" d="M 90 231 H 65 V 524 H 600.0 V 548" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="final_screen" data-conditional="true" d="M 90 231 H 65 V 524 H 1020.0 V 548" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="finish_review" data-conditional="true" d="M 90 231 H 65 V 524 H 1230.0 V 548" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="generate_report" data-conditional="true" d="M 180.0 272 V 314 H 1230.0 V 363" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="parse_jd" data-target="interview_questions" data-conditional="true" d="M 90 231 H 65 V 524 H 390.0 V 548" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="rank_candidates" data-target="generate_report" data-conditional="false" d="M 1230.0 272 V 363" fill="none" stroke="#0369a1" stroke-width="2.2" opacity="1" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="search_resumes" data-target="expand_search" data-conditional="true" d="M 790 231 H 863" fill="none" stroke="#0369a1" stroke-width="2.2" opacity="1" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="search_resumes" data-target="generate_report" data-conditional="true" d="M 700.0 272 V 314 H 1230.0 V 363" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" stroke-dasharray="5 4" marker-end="url(#workflow-arrow)"/><path class="edge" data-source="finish_review" data-target="__end__" data-conditional="false" d="M 1230.0 637 V 675" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.7" marker-end="url(#workflow-arrow)"/><g class="node terminal" data-node="__start__" tabindex="0" role="button" aria-label="START. A new review"><circle cx="30" cy="231" r="20" fill="#334155"/><text x="30" y="235" fill="white" text-anchor="middle" font-size="9" font-weight="700">START</text></g><g class="node" data-node="parse_jd" tabindex="0" role="button" aria-label="Parse request. Select the next action"><title>Interpret a job description or follow-up, select an action, and propose complete criteria. Clarification, tool requests, and review actions follow their declared branches.</title><rect x="90" y="190" width="180" height="82" rx="5" fill="#faf5ff" stroke="#cbd5e1"/><rect x="90" y="190" width="4" height="82" rx="2" fill="#6d28d9"/><text x="103" y="209" fill="#6d28d9" font-size="9.2">OpenAI / routing</text><text x="103" y="231" fill="#0f172a" font-size="14" font-weight="600">Parse request</text><text x="103" y="253" fill="#475569" font-size="9.5">Select the next action</text></g><g class="node" data-node="extract_requirements" tabindex="0" role="button" aria-label="Extract requirements. Validate proposed criteria"><title>Validate criteria and retain exact user conditions, examples and interpretation assumptions. Preserve unchanged meanings and evidence standards through refinements; compile new or changed meanings before candidate assessment. Keep uncommitted requirements separate until the new search succeeds.</title><rect x="350" y="190" width="180" height="82" rx="5" fill="#faf5ff" stroke="#cbd5e1"/><rect x="350" y="190" width="4" height="82" rx="2" fill="#6d28d9"/><text x="363" y="209" fill="#6d28d9" font-size="9.2">OpenAI / validation</text><text x="363" y="231" fill="#0f172a" font-size="13" font-weight="600">Extract requirements</text><text x="363" y="253" fill="#475569" font-size="9.5">Validate proposed criteria</text></g><g class="node" data-node="search_resumes" tabindex="0" role="button" aria-label="Search resumes. Retrieve from the corpus"><title>Search source windows with local dense and lexical retrieval. This step retrieves candidates; it does not use heuristic skill or duration gaps to reject candidates in the connected contextual workflow.</title><rect x="610" y="190" width="180" height="82" rx="5" fill="#f0f9ff" stroke="#cbd5e1"/><rect x="610" y="190" width="4" height="82" rx="2" fill="#0369a1"/><text x="623" y="209" fill="#0369a1" font-size="9.2">Local / BGE + BM25</text><text x="623" y="231" fill="#0f172a" font-size="14" font-weight="600">Search resumes</text><text x="623" y="253" fill="#475569" font-size="9.5">Retrieve from the corpus</text></g><g class="node" data-node="expand_search" tabindex="0" role="button" aria-label="Expand retrieval. Qwen3 full-resume ranking"><title>Retrieve original passages for each criterion, then score every complete resume with the pinned Qwen3 Reranker 4B. Learned relevance determines the shortlist without a lexical score blend or an early candidate cut. This stage makes no per-candidate OpenAI call and no qualification decision.</title><rect x="870" y="190" width="180" height="82" rx="5" fill="#f0f9ff" stroke="#cbd5e1"/><rect x="870" y="190" width="4" height="82" rx="2" fill="#0369a1"/><text x="883" y="209" fill="#0369a1" font-size="9.2">Local / Qwen3 4B</text><text x="883" y="231" fill="#0f172a" font-size="14" font-weight="600">Expand retrieval</text><text x="883" y="253" fill="#475569" font-size="9.5">Qwen3 full-resume ranking</text></g><g class="node" data-node="rank_candidates" tabindex="0" role="button" aria-label="Rank candidates. Select ten provisional profiles"><title>Select ten provisional candidates by retrieval relevance. Retain per-criterion passage leads and reserve candidate IDs. Do not infer eligibility, years or strengths. A changed requirement revision clears previous detailed findings and recommendations.</title><rect x="1140" y="190" width="180" height="82" rx="5" fill="#f0f9ff" stroke="#cbd5e1"/><rect x="1140" y="190" width="4" height="82" rx="2" fill="#0369a1"/><text x="1153" y="209" fill="#0369a1" font-size="9.2">Local / selection</text><text x="1153" y="231" fill="#0f172a" font-size="14" font-weight="600">Rank candidates</text><text x="1153" y="253" fill="#475569" font-size="9.5">Select ten provisional profiles</text></g><g class="node" data-node="generate_report" tabindex="0" role="button" aria-label="Generate report. Render current state"><title>Render the current screening findings, comparisons, questions, or error response from stored state. Keep source excerpts and unresolved evidence visible in the conversation.</title><rect x="1140" y="370" width="180" height="82" rx="5" fill="#f0f9ff" stroke="#cbd5e1"/><rect x="1140" y="370" width="4" height="82" rx="2" fill="#0369a1"/><text x="1153" y="389" fill="#0369a1" font-size="9.2">Local / presentation</text><text x="1153" y="411" fill="#0f172a" font-size="14" font-weight="600">Generate report</text><text x="1153" y="433" fill="#475569" font-size="9.5">Render current state</text></g><g class="node" data-node="human_feedback" tabindex="0" role="button" aria-label="Human feedback. Save, pause, and resume"><title>A LangGraph interrupt pauses the conversation. A new message resumes the same review through its checkpoint and returns to request interpretation. The application uses durable SQLite checkpoints.</title><rect x="870" y="370" width="180" height="82" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><rect x="870" y="370" width="4" height="82" rx="2" fill="#475569"/><text x="883" y="389" fill="#475569" font-size="9.2">State / interrupt</text><text x="883" y="411" fill="#0f172a" font-size="14" font-weight="600">Human feedback</text><text x="883" y="433" fill="#475569" font-size="9.5">Save, pause, and resume</text></g><g class="node" data-node="compare_candidates" tabindex="0" role="button" aria-label="Compare candidates. Explain the differences"><title>Resolve candidate IDs and compare the available source evidence and current criterion findings. A comparison does not silently change the job requirements.</title><rect x="90" y="555" width="180" height="82" rx="5" fill="#f0f9ff" stroke="#cbd5e1"/><rect x="90" y="555" width="4" height="82" rx="2" fill="#0369a1"/><text x="103" y="574" fill="#0369a1" font-size="9.2">Local / reviewed state</text><text x="103" y="596" fill="#0f172a" font-size="14" font-weight="600">Compare candidates</text><text x="103" y="618" fill="#475569" font-size="9.5">Explain the differences</text></g><g class="node" data-node="interview_questions" tabindex="0" role="button" aria-label="Interview questions. Explicit request after review"><title>On request, prepare candidate-specific questions from evidence gaps and reported work, with follow-ups and assessment guidance.</title><rect x="300" y="555" width="180" height="82" rx="5" fill="#faf5ff" stroke="#cbd5e1"/><rect x="300" y="555" width="4" height="82" rx="2" fill="#6d28d9"/><text x="313" y="574" fill="#6d28d9" font-size="9.2">OpenAI / generation</text><text x="313" y="596" fill="#0f172a" font-size="13" font-weight="600">Interview questions</text><text x="313" y="618" fill="#475569" font-size="9.5">Explicit request after review</text></g><g class="node" data-node="file_tool" tabindex="0" role="button" aria-label="File tools. Read, list, search, write"><title>Use the inherited hardened filesystem tools. Reads stay inside the project; generated reports are written inside the designated report directory.</title><rect x="510" y="555" width="180" height="82" rx="5" fill="#f0f9ff" stroke="#cbd5e1"/><rect x="510" y="555" width="4" height="82" rx="2" fill="#0369a1"/><text x="523" y="574" fill="#0369a1" font-size="9.2">Local / filesystem</text><text x="523" y="596" fill="#0f172a" font-size="14" font-weight="600">File tools</text><text x="523" y="618" fill="#475569" font-size="9.5">Read, list, search, write</text></g><g class="node" data-node="deep_screen" tabindex="0" role="button" aria-label="Detailed screening. Review source evidence"><title>Run the first full-source qualification assessment on up to ten candidates. Extract and audit work records, assess requirements and useful context, calculate dates locally, then audit evidence. Publish completed and pending records with candidate progress.</title><rect x="720" y="555" width="180" height="82" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><rect x="720" y="555" width="4" height="82" rx="2" fill="#475569"/><text x="733" y="574" fill="#475569" font-size="9.2">Nested graph / 4 workers</text><text x="733" y="596" fill="#0f172a" font-size="14" font-weight="600">Detailed screening</text><text x="733" y="618" fill="#475569" font-size="9.5">Review source evidence</text></g><g class="node" data-node="final_screen" tabindex="0" role="button" aria-label="Recommendations. Decision policy + audited memo"><title>Check completed evidence and derive advance, hold or no-hire boundaries. Generate a cohort memo with comparisons, justified priority groups and decision contingencies. Audit its claims against reviewed facts and frozen requirements before publishing. No full-resume reassessment.</title><rect x="930" y="555" width="180" height="82" rx="5" fill="#faf5ff" stroke="#cbd5e1"/><rect x="930" y="555" width="4" height="82" rx="2" fill="#6d28d9"/><text x="943" y="574" fill="#6d28d9" font-size="9.2">OpenAI + local policy</text><text x="943" y="596" fill="#0f172a" font-size="14" font-weight="600">Recommendations</text><text x="943" y="618" fill="#475569" font-size="9.5">Decision policy + audited memo</text></g><g class="node" data-node="finish_review" tabindex="0" role="button" aria-label="Complete review. Record human completion"><title>An explicit completion request ends this conversation workflow while preserving the saved screening report and its evidence.</title><rect x="1140" y="555" width="180" height="82" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><rect x="1140" y="555" width="4" height="82" rx="2" fill="#475569"/><text x="1153" y="574" fill="#475569" font-size="9.2">State / completion</text><text x="1153" y="596" fill="#0f172a" font-size="14" font-weight="600">Complete review</text><text x="1153" y="618" fill="#475569" font-size="9.5">Record human completion</text></g><g class="node terminal" data-node="__end__" tabindex="0" role="button" aria-label="END. Review complete"><circle cx="1230" cy="702" r="20" fill="#334155"/><text x="1230" y="706" fill="white" text-anchor="middle" font-size="9" font-weight="700">END</text></g><path d="M 90 765 H 430" stroke="#cbd5e1"/><text x="90" y="787" fill="#475569" font-size="10" letter-spacing=".6">REQUIREMENTS</text><text x="90" y="809" fill="#334155" font-size="10.5">messages · requirements · requirements_version</text><path d="M 460 765 H 800" stroke="#cbd5e1"/><text x="460" y="787" fill="#475569" font-size="10" letter-spacing=".6">REVIEW STATE</text><text x="460" y="809" fill="#334155" font-size="10.5">shortlist · detailed_reviews · decision_memo</text><path d="M 830 765 H 1170" stroke="#cbd5e1"/><text x="830" y="787" fill="#475569" font-size="10" letter-spacing=".6">PERSISTENCE</text><text x="830" y="809" fill="#334155" font-size="10.5">SQLite checkpoint · interrupt / resume</text><text x="60" y="863" fill="#64748b" font-size="11">15 nodes · 25 transitions · Solid: fixed transition / dashed: conditional transition</text></g></svg></div><div id="review-canvas" class="canvas" hidden><svg xmlns="http://www.w3.org/2000/svg" data-graph="review" viewBox="0 0 1410 500" role="img" aria-labelledby="review-title review-desc"><title id="review-title">Contextual reviewer: detailed evidence review</title><desc id="review-desc">Actual nested graph: extract and audit work records, assess requirements and work context, then audit the proposed findings while retaining unresolved disputes.</desc><defs><marker id="review-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1410" height="500" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="60" y="43" fill="#64748b" font-size="11" letter-spacing="1">02 / CANDIDATE R <script>
const bundle={"schema_version": 2, "source": "Compiled build_graph with ContextualReviewer connected, and ContextualReviewer.review_graph", "provider_calls_during_generation": 0, "workflow_policy": "contextual", "graphs": {"workflow": {"title": "Resume matching: connected conversation workflow", "description": "Compiled conversation graph with local initial retrieval, detailed candidate assessment, comparative recommendations and persistent feedback.", "nodes": {"__start__": {"title": "START", "subtitle": "A new review", "detail": "A new conversation enters the compiled graph. Its review ID isolates the saved state.", "fields": []}, "parse_jd": {"title": "Parse request", "subtitle": "Select the next action", "detail": "Interpret a job description or follow-up, select an action, and propose complete criteria. Clarification, tool requests, and review actions follow their declared branches.", "fields": ["messages", "request", "plan"]}, "extract_requirements": {"title": "Extract requirements", "subtitle": "Validate proposed criteria", "detail": "Validate criteria and retain exact user conditions, examples and interpretation assumptions. Preserve unchanged meanings and evidence standards through refinements; compile new or changed meanings before candidate assessment. Keep uncommitted requirements separate until the new search succeeds.", "fields": ["pending_requirements"]}, "search_resumes": {"title": "Search resumes", "subtitle": "Retrieve from the corpus", "detail": "Search source windows with local dense and lexical retrieval. This step retrieves candidates; it does not use heuristic skill or duration gaps to reject candidates in the connected contextual workflow.", "fields": ["pending_search_result", "tool_events"]}, "expand_search": {"title": "Expand retrieval", "subtitle": "Qwen3 full-resume ranking", "detail": "Retrieve original passages for each criterion, then score every complete resume with the pinned Qwen3 Reranker 4B. Learned relevance determines the shortlist without a lexical score blend or an early candidate cut. This stage makes no per-candidate OpenAI call and no qualification decision.", "fields": ["pending_search_result", "tool_events"]}, "rank_candidates": {"title": "Rank candidates", "subtitle": "Select ten provisional profiles", "detail": "Select ten provisional candidates by retrieval relevance. Retain per-criterion passage leads and reserve candidate IDs. Do not infer eligibility, years or strengths. A changed requirement revision clears previous detailed findings and recommendations.", "fields": ["requirements", "requirements_version", "shortlist", "ranking_changes"]}, "generate_report": {"title": "Generate report", "subtitle": "Render current state", "detail": "Render the current screening findings, comparisons, questions, or error response from stored state. Keep source excerpts and unresolved evidence visible in the conversation.", "fields": ["report", "screening_report", "messages"]}, "human_feedback": {"title": "Human feedback", "subtitle": "Save, pause, and resume", "detail": "A LangGraph interrupt pauses the conversation. A new message resumes the same review through its checkpoint and returns to request interpretation. The application uses durable SQLite checkpoints.", "fields": ["checkpoint", "session_id", "pending_nodes"]}, "compare_candidates": {"title": "Compare candidates", "subtitle": "Explain the differences", "detail": "Resolve candidate IDs and compare the available source evidence and current criterion findings. A comparison does not silently change the job requirements.", "fields": ["comparison", "tool_events"]}, "interview_questions": {"title": "Interview questions", "subtitle": "Explicit request after review", "detail": "On request, prepare candidate-specific questions from evidence gaps and reported work, with follow-ups and assessment guidance.", "fields": ["questions", "tool_events"]}, "file_tool": {"title": "File tools", "subtitle": "Read, list, search, write", "detail": "Use the inherited hardened filesystem tools. Reads stay inside the project; generated reports are written inside the designated report directory.", "fields": ["tool_request", "tool_result"]}, "deep_screen": {"title": "Detailed screening", "subtitle": "Review source evidence", "detail": "Run the first full-source qualification assessment on up to ten candidates. Extract and audit work records, assess requirements and useful context, calculate dates locally, then audit evidence. Publish completed and pending records with candidate progress.", "fields": ["shortlist", "detailed_reviews", "round", "deep_screen_version"]}, "final_screen": {"title": "Recommendations", "subtitle": "Decision policy + audited memo", "detail": "Check completed evidence and derive advance, hold or no-hire boundaries. Generate a cohort memo with comparisons, justified priority groups and decision contingencies. Audit its claims against reviewed facts and frozen requirements before publishing. No full-resume reassessment.", "fields": ["shortlist", "decision_memo", "round"]}, "finish_review": {"title": "Complete review", "subtitle": "Record human completion", "detail": "An explicit completion request ends this conversation workflow while preserving the saved screening report and its evidence.", "fields": ["status", "messages"]}, "__end__": {"title": "END", "subtitle": "Review complete", "detail": "The human reviewer explicitly completed this workflow.", "fields": ["status"]}}, "edges": [{"source": "__start__", "target": "parse_jd", "conditional": false}, {"source": "compare_candidates", "target": "generate_report", "conditional": false}, {"source": "deep_screen", "target": "final_screen", "conditional": true}, {"source": "deep_screen", "target": "generate_report", "conditional": true}, {"source": "expand_search", "target": "generate_report", "conditional": true}, {"source": "expand_search", "target": "rank_candidates", "conditional": true}, {"source": "extract_requirements", "target": "generate_report", "conditional": true}, {"source": "extract_requirements", "target": "search_resumes", "conditional": true}, {"source": "file_tool", "target": "generate_report", "conditional": false}, {"source": "final_screen", "target": "generate_report", "conditional": false}, {"source": "generate_report", "target": "human_feedback", "conditional": false}, {"source": "human_feedback", "target": "parse_jd", "conditional": false}, {"source": "interview_questions", "target": "generate_report", "conditional": false}, {"source": "parse_jd", "target": "compare_candidates", "conditional": true}, {"source": "parse_jd", "target": "deep_screen", "conditional": true}, {"source": "parse_jd", "target": "extract_requirements", "conditional": true}, {"source": "parse_jd", "target": "file_tool", "conditional": true}, {"source": "parse_jd", "target": "final_screen", "conditional": true}, {"source": "parse_jd", "target": "finish_review", "conditional": true}, {"source": "parse_jd", "target": "generate_report", "conditional": true}, {"source": "parse_jd", "target": "interview_questions", "conditional": true}, {"source": "rank_candidates", "target": "generate_report", "conditional": false}, {"source": "search_resumes", "target": "expand_search", "conditional": true}, {"source": "search_resumes", "target": "generate_report", "conditional": true}, {"source": "finish_review", "target": "__end__", "conditional": false}], "routes": {"all": {"title": "All transitions", "path": []}, "search": {"title": "Initial search", "path": ["__start__", "parse_jd", "extract_requirements", "search_resumes", "expand_search", "rank_candidates", "generate_report", "human_feedback"]}, "refine": {"title": "Refine requirements", "path": ["human_feedback", "parse_jd", "extract_requirements", "search_resumes", "expand_search", "rank_candidates", "generate_report", "human_feedback"]}, "deep": {"title": "Detailed screening", "path": ["human_feedback", "parse_jd", "deep_screen", "generate_report", "human_feedback"]}, "final": {"title": "Recommendations", "path": ["human_feedback", "parse_jd", "deep_screen", "final_screen", "generate_report", "human_feedback"]}, "finish": {"title": "Complete review", "path": ["human_feedback", "parse_jd", "finish_review", "__end__"]}}}, "review": {"title": "Contextual reviewer: detailed evidence review", "description": "Actual nested graph: extract and audit work records, assess requirements and work context, then audit the proposed findings while retaining unresolved disputes.", "nodes": {"__start__": {"title": "START", "subtitle": "Detailed review begins", "detail": "The nested graph receives a source packet for one candidate and the current frozen criteria. It does not contain a separate human interrupt.", "fields": ["packet"]}, "extract_and_audit_work_history": {"title": "Prepare work records", "subtitle": "Source extraction + audit", "detail": "Extract and separately audit the complete source inventory within detailed screening. Preserve all employment, source IDs and dates. Reuse these source-only records on later requests; they are never required for initial retrieval.", "fields": ["packet", "steps"]}, "assess_requirements": {"title": "Assess requirements", "subtitle": "Criteria and work observations", "detail": "Assess the frozen criteria against source-linked work records. Return criterion findings, positive date associations and useful work observations together. Code calculates experience. No questions or recommendations.", "fields": ["packet", "first", "steps"]}, "audit_evidence": {"title": "Audit final evidence", "subtitle": "Source, dates and claim checks", "detail": "Check the draft criteria, positive duration links, endpoints and observations against the full source and frozen standard. Remove rejected links before local arithmetic. A support-status disagreement remains uncertain with both judgments retained; agreed support can retain a narrative correction. Return the source-bound assessment and explicit disputes.", "fields": ["packet", "final", "observation_audit", "steps"]}, "__end__": {"title": "END", "subtitle": "Return reviewed evidence", "detail": "Return the nested review state to detailed screening. The outer graph generates the report and waits for human feedback.", "fields": ["final", "observation_audit", "steps"]}}, "edges": [{"source": "__start__", "target": "extract_and_audit_work_history", "conditional": false}, {"source": "assess_requirements", "target": "audit_evidence", "conditional": false}, {"source": "extract_and_audit_work_history", "target": "assess_requirements", "conditional": false}, {"source": "audit_evidence", "target": "__end__", "conditional": false}], "routes": {"all": {"title": "All transitions", "path": []}, "complete": {"title": "Complete evidence", "path": ["__start__", "extract_and_audit_work_history", "assess_requirements", "audit_evidence", "__end__"]}}}}, "nested_invocation": {"outer_node": "deep_screen", "graph": "review", "kind": "method invocation"}};

const graph=()=>bundle.graphs[view];
const canvas=()=>document.getElementById(view+'-canvas');
function pick(id){if(!graph().nodes[id])throw Error('Unknown graph node '+id);selected[view]=id;const n=graph().nodes[id];document.getElementById('step-title').textContent=n.title;document.getElementById('step-detail').textContent=n.detail;document.getElementById('fields').replaceChildren(...n.fields.map(f=>{const s=document.createElement('span');s.className='tag';s.textContent=f;return s}));document.getElementById('transitions').replaceChildren(...graph().edges.filter(e=>e.source===id).map(e=>{const b=document.createElement('button');b.textContent=graph().nodes[e.target].title;const s=document.createElement('small');s.textContent=e.conditional?'Conditional transition':'Transition';b.append(s);b.onclick=()=>pick(e.target);return b}));canvas().querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.node===id));document.getElementById('open-review').hidden=!(view==='workflow'&&id==='deep_screen');}
function highlight(key){route[view]=key;const path=graph().routes[key].path;document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===key));canvas().querySelectorAll('.node').forEach(n=>n.style.opacity=key==='all'||path.includes(n.dataset.node)?1:.24);canvas().querySelectorAll('.edge').forEach(e=>{const active=key==='all'||path.some((n,i)=>n===e.dataset.source&&path[i+1]===e.dataset.target);e.style.opacity=active?1:.06;e.style.strokeWidth=active?2.5:1.1;});}
